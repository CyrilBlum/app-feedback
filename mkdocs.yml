site_name: Cyril Blum's apps
site_url: https://docs.cblum.ch/
site_description: Documentation, changelogs and feedback for the apps by Cyril Blum.
repo_url: https://github.com/CyrilBlum/app-feedback
repo_name: app-feedback
edit_uri: ""
copyright: Cyril Blum, <a href="https://cblum.ch/apps/">cblum.ch/apps</a>

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - toc.follow
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Better Baby Book:
      - Overview: better-baby-book/index.md
      - Features: better-baby-book/features.md
      - Family sync: better-baby-book/family-sync.md
      - Backup and deletion: better-baby-book/backup-and-deletion.md
      - Changelog: better-baby-book/changelog.md
      - Feedback and development: better-baby-book/feedback.md
  - Cycloputer:
      - Overview: cycloputer/index.md
      - Features: cycloputer/features.md
      - Routing, offline data and recordings: cycloputer/routing-and-data.md
      - Changelog: cycloputer/changelog.md
      - Feedback and development: cycloputer/feedback.md
  - Pixel Porter:
      - Overview: pixel-porter/index.md
      - Features: pixel-porter/features.md
      - Sync model: pixel-porter/sync-model.md
      - Changelog: pixel-porter/changelog.md
      - Feedback and development: pixel-porter/feedback.md
  - Rapid Reminders:
      - Overview: rapid-reminders/index.md
      - Features: rapid-reminders/features.md
      - Sync, sharing and data: rapid-reminders/sync-and-data.md
      - Changelog: rapid-reminders/changelog.md
      - Feedback and development: rapid-reminders/feedback.md

  - ScreenSnipStudio:
      - Overview: screensnipstudio/index.md
      - Features: screensnipstudio/features.md
      - Projects, exports and privacy: screensnipstudio/projects-and-sharing.md
      - Changelog: screensnipstudio/changelog.md
      - Feedback and development: screensnipstudio/feedback.md

  - TimeTrackingTool:
      - Overview: timetrackingtool/index.md
      - iPhone features: timetrackingtool/features.md
      - Calendars, sync and data: timetrackingtool/data-and-sync.md
      - Mac workflow: timetrackingtool/mac.md
